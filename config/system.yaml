# System-wide configuration: safety thresholds, networking, persistence, LLM.

safety:
  max_tracking_error_m: 3.0
  max_latency_ms: 500
  heartbeat_timeout_s: 2.0
  telemetry_stale_s: 2.0
  max_command_rate_hz: 20
  min_battery_percent: 15

gateway:
  host: "0.0.0.0"
  port: 8000
  # WebSocket endpoint the ROS2 turtlebot node (ros_node/) connects out to.
  # Kept as a client->server connection so the gateway never needs inbound
  # network access to the robot, only the reverse.
  ws_ingest_path: "/ws/ingest"
  # CORS origins allowed to reach the REST/WebSocket API. Restrict this to
  # your operator workstation(s) in any non-lab deployment.
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

persistence:
  driver: sqlite
  sqlite_path: "./data/experiments.db"

supervisor:
  # mock | disabled | openai | claude
  provider: "mock"
  interval_s: 5.0
  # Model ids are read from environment variables (OPENAI_MODEL /
  # ANTHROPIC_MODEL) — never hard-code a specific model id here.

# Always-on anomaly detection (backend/app/anomaly_detector.py). Runs every
# control-loop tick regardless of which UI panel is open. All fields are
# optional — omit any you don't want to override.
anomaly:
  enabled: true
  stuck_window_s: 4.0
  stuck_command_threshold: 0.03
  stuck_distance_m: 0.05
  battery_window_s: 30.0
  battery_drop_pct: 5.0
  position_jump_max_speed_mps: 8.0
  heading_oscillation_window_s: 2.0
  heading_oscillation_min_flips: 4
  heading_oscillation_min_rate_radps: 0.3
  cooldown_s: 20.0

mode: "PHYSICAL"   # SIMULATION | TEST | PHYSICAL
